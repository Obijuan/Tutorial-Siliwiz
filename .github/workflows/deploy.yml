name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Descargar e instalar mdbook-katex
        run: |
          KATEX_VERSION="0.14.0"
          curl -sSL "https://github.com/lzanini/mdbook-katex/releases/download/v${KATEX_VERSION}/mdbook-katex-v${KATEX_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          mv mdbook-katex /usr/local/bin/
          chmod +x /usr/local/bin/mdbook-katex

      - name: Compilar la documentación (Generar HTML)
        run: mdbook build

      - name: Subir artefactos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        